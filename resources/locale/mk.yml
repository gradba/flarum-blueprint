gradba-blueprint:
  admin:
    settings:
      primaryColor: Примарна боја
      primaryColor-Help: >-
        Акцентот. Се користи за примарното копче и речиси никаде повеќе — темата е
        градена околу еден акцент по екран, па неговата употреба на друго место го
        ослабува.
      accentColor: Секундарна боја
      accentColor-Help: >-
        Се користи за врски, фокус-рамки и hover состојби, и како нијанса од која
        Flarum ги изведува придушениот текст и површините на контролите. Нека биде
        заситена умерено.
      bodyBg: Позадина на страницата
      bodyBg-Help: >-
        Бојата зад сѐ. Малку топла кремаста бела делува помеко од чисто белата и им
        овозможува на картичките да се одделат од страницата.
      showGrid: Прикажи ја мрежата
      showGrid-Help: >-
        Исцртува бледа мрежа од две линии врз позадината, во иста боја како рабовите.
        По неа темата го носи името.
      gridSize: Густина на мрежата
      gridSize-Help: Растојание меѓу линиите на мрежата, во пиксели. Стандардно е 56.
